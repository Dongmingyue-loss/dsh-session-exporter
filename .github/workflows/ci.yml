name: ci

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit-${{ matrix.os }}-py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
          python -m pip install -r requirements-dsh.txt
      - name: Unit and API tests
        run: python -m unittest discover -s test -v
      - name: Syntax and undefined names
        run: ruff check --select E9,F .
      - name: Verify zstd decoder
        run: python -c "import sys; sys.path.insert(0,'.'); from sources.dsh import decoder_name; print('zstd decoder:', decoder_name())"

  ui:
    name: ui-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install chromium
          fi
      - name: Generate demo sessions
        run: python scripts/make_demo_sessions.py
      - name: Headless browser smoke test
        run: python test/ui_smoke.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: ignore
